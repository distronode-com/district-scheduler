# District Scheduler — Claims → Verification Manifest
#
# Every public claim we make about District Scheduler's architecture, security, and
# privacy, mapped to exactly how to verify it against the actual source. This is not a
# certification and not a substitute for your own review — it's a falsifiable index
# so you (or your own LLM/agent) can check each claim in minutes instead of hours.
#
# District Scheduler is Distronode Corporation's fork of Calnode. Most of what is
# below is upstream's code and upstream's claim, unchanged here. Where the fork
# diverges the entry says so, and the two entries that are wholly the fork's are
# `postgres-image-and-mode` and `row-level-security-tenant-isolation`.
#
# How to use this file:
#   1. Clone the repo at the commit this file ships with (`last_verified_commit`).
#   2. For each claim, run the `verify` commands and/or read the cited files.
#   3. If a claim doesn't hold, it's a bug in our claims (or our code) — please open
#      an issue:
#      https://github.com/distronode-corporation/district-scheduler/issues
#
# See AUDIT.md for the full audit workflow (deterministic scanners + LLM prompt-pack).

version: 1
last_verified: "2026-09-12"
last_verified_commit: "10a561e"

claims:
  - id: single-binary-sqlite-build
    claim: >
      With `MULTI_TENANT` unset, this ships as a single static Go binary with an
      embedded SQLite database. No Postgres, MySQL, or Redis SERVER is required —
      self-hosting is `docker run` or one binary on a VPS. This is upstream
      Calnode's build, and the fork does not modify the recipe that produces it.
    verify:
      - "The single-binary image is built from upstream's Dockerfile, byte for
         byte. Prove it rather than believe it:
           git remote add upstream https://github.com/Calnode/calnode
           git fetch upstream
           git diff upstream/main -- Dockerfile entrypoint.sh litestream.yml
         Expect no output. The fork's own image is a separate file
         (Dockerfile.district) and is the next entry."
      - "grep -iE 'mysql|redis' go.mod — expect no matches. ⚠️ A grep for
         'postgres' DOES match, and that is the claim being precise rather than the
         claim being broken: the two database drivers compiled in are
         modernc.org/sqlite (pure Go, no CGO — the whole reason CGO_ENABLED=0
         cross-compiles cleanly) and github.com/jackc/pgx/v5. What this entry says
         is that no server is REQUIRED for this build, not that no driver exists.
         An earlier version of this file asserted the grep found nothing, which had
         been false since PostgreSQL support landed."
      - "internal/db/db.go's OpenDB picks the engine from the DATABASE_URL scheme:
         a postgres:// URL selects PostgreSQL, everything else (sqlite://./rel,
         sqlite:///abs, :memory:, a bare path) selects SQLite. The default, in
         internal/config/config.go, is sqlite://./data/calnode.db."
      - "internal/config/config.go's Validate returns nil for a single-tenant
         instance before it reaches any of the PostgreSQL requirements, so nothing
         about this build can demand a server."
    status: verified
    caveat: >
      This repository produces TWO images and this entry covers only the first.
      MULTI_TENANT mode refuses to boot without a postgres:// DSN, because tenant
      isolation there is PostgreSQL row-level security and SQLite has no equivalent
      to express it with. So "no server database required" is a true statement about
      the single-tenant build and a false one about the mode this fork exists for.
      The two entries are meant to be read together, never separately.

  - id: postgres-image-and-mode
    claim: >
      The image this fork deploys is PostgreSQL-only and is a different file from
      the one above. Dockerfile.district builds a distroless, non-root image with no
      SQLite file, no Litestream and no shell entrypoint, and `MULTI_TENANT`
      requires PostgreSQL plus two distinct database roles or it refuses to start.
    verify:
      - "Dockerfile.district, the runtime stage (from the `FROM
         gcr.io/distroless/static-debian12:nonroot` line onward): USER 10001:10001,
         ENTRYPOINT is the binary itself. There is no shell in the image, so there
         is nothing supervising the process and no entrypoint script to read."
      - "Contrast it with upstream's: grep -n -i 'litestream' Dockerfile
         entrypoint.sh litestream.yml matches all three, and Dockerfile.district
         references none of them. (It mentions Litestream only in its header
         comment, saying why it has none — so grep the two files side by side
         rather than grepping for the word.)"
      - "internal/config/config.go's Validate, MULTI_TENANT branch: a non-postgres
         DATABASE_URL, a missing DATABASE_ADMIN_URL, and the two DSNs naming one
         role are each a startup error with its own message. Run the image with
         MULTI_TENANT=1 and a sqlite:// DSN and read what it exits with."
      - ".github/workflows/docker-publish.yml — `file: Dockerfile.district`. The
         upstream Dockerfile is not built by this repository's CI at all."
    status: verified
    caveat: >
      The binary is the same binary: one build with both engines compiled in, and
      the image only decides which one it is configured to reach. Somebody tracing
      the SQLite code paths in this repository is not looking at dead code, and a
      PostgreSQL-only image is a deployment property, not a compile-time one.

  - id: row-level-security-tenant-isolation
    claim: >
      In `MULTI_TENANT` mode one process serves many isolated workspaces, and the
      isolation boundary is PostgreSQL row-level security — not a predicate the
      query author has to remember. Every tenant table carries a workspace_id, has
      ENABLE ROW LEVEL SECURITY, and has exactly one policy comparing that column to
      current_setting('app.workspace_id'). The application role is NOBYPASSRLS and
      owns no table in the schema. An unbound statement therefore matches no row:
      silently empty rather than silently global. With the variable unset, none of
      this is reachable and single-tenant behaviour is unchanged.
    verify:
      - "internal/db/rls_proof_test.go —
         TestPostgres_rlsIsolatesAnUnprivilegedRole is the executable proof.
         Unbound, the application role reads 0 of 2 seeded rows and its INSERT is
         refused with SQLSTATE 42501, leaving nothing behind in the default
         workspace; bound, it reads and writes exactly its own. It carries a
         positive control on the DATA (the owner role sees both rows first), so a
         zero cannot be an empty table."
      - "internal/db/tenancy_test.go — the schema half:
         TestPostgres_exactlyOnePolicyPerTenantTable,
         TestPostgres_exemptTablesHaveNoTenantColumn,
         TestPostgres_rlsIsOffUntilEnabled,
         TestPostgres_appRoleCannotWriteTheTenantRoot,
         TestPostgres_compositeUniqueness, and TestSQLite_enableRLSIsANoOp."
      - "internal/server/tenancy_proof_test.go — the request half, end to end:
         TestProof_noRouteLeaksAnotherWorkspace, TestProof_everyMCPToolIsScoped,
         TestProof_everyWorkerJobTypeIsCoveredAndScoped, and
         TestProof_unscopedQueryReturnsNothing, which is the negative control."
      - "internal/handler/caldav_connect_tenancy_test.go,
         calendar_reconcile_tenancy_test.go, calendar_tenancy_test.go,
         sso_tenancy_test.go and tracking_tenancy_test.go — the per-handler tests
         for the paths that resolve a workspace from something other than the
         request Host."
      - "internal/db's VerifyRoles, called at boot: it refuses an application role
         that is a superuser, holds BYPASSRLS, or owns any table, and refuses a
         platform role that does NOT bypass. A single role for both DSNs is the
         misconfiguration hardest to notice from the outside — every request works,
         and it can also read every other workspace — so startup refuses it
         outright."
      - "⛔ All of the above need a real PostgreSQL. Export
         CALNODE_TEST_POSTGRES_DSN=postgres://... and run
         `go test ./internal/db/ ./internal/server/ ./internal/handler/`. WITHOUT
         it every PostgreSQL case SKIPS and a green run proves nothing about this
         claim — read the skip count before you believe the result."
      - "Run the tenant-isolation prompt in audit/prompts/prompt-pack.md against
         your own LLM to have it try to find a cross-tenant path."
    status: verified
    caveat: >
      Three things this claim does not say.
      (1) FORCE ROW LEVEL SECURITY is deliberately NOT used. It would apply the
      policy to the table owner too, and in single-tenant mode the ordinary DSN
      *is* the owner, so every existing deployment whose DSN is not a superuser
      would go blind. ENABLE alone already isolates a non-owner role, which is what
      the application role is.
      (2) There is a handle that bypasses the policies on purpose — the platform
      handle, which runs migrations, the worker's cross-tenant claim loop and the
      platform API. Five tables are exempt from tenancy because they are not per
      tenant (workspaces, crypto_keystore, goose_db_version, oauth_clients,
      sso_nonces), and everything reading those names its own workspace_id in every
      statement because there is no policy behind it. docs/MULTI_TENANT.md states
      both rules and the bugs each has already caused here.
      (3) The data encryption key is per PROCESS, not per workspace:
      crypto_keystore holds one wrapped DEK, so an operator who can read the
      database can decrypt every workspace, and a workspace cannot move between
      instances without its key. Export carries a fingerprint of the wrapped key and
      import refuses a mismatch, which makes that coupling loud rather than silent.
      Per-tenant DEKs are a known, unbuilt follow-up.
      This is a runtime enforcement claim, unlike the instance-per-tenant claim it
      replaces, which was true by the absence of a tenant model. That model now
      exists, so the honest statement is about what the database enforces and what
      startup refuses.

  - id: meeting-content-egress
    claim: >
      Meeting CONTENT — recorded audio and transcripts — only ever leaves your
      infrastructure to services you explicitly configure: Deepgram (audio, if you
      enable the notetaker) and your own BYO-LLM endpoint (transcript text, for the
      same notetaker's summary step). Nothing carries meeting content by default.
    verify:
      - "grep -rn 'api.deepgram.com' internal/ — the single outbound call site
         that receives recorded audio (internal/stt/deepgram.go). Calnode hands
         Deepgram a presigned, time-limited GET URL into your own bucket rather
         than uploading the file itself — Deepgram's servers fetch it."
      - "internal/handler/notetaker.go — the summarize step sends the full
         transcript text to h.getLLM() (your configured BYO-LLM endpoint), the same
         client used by the conversational booking assistant. See
         internal/llm/client.go."
      - "Recordings themselves go to YOUR OWN S3-compatible bucket (LITESTREAM_*
         env vars), never to Calnode or any third party — see
         internal/handler/livekit_recording.go and migration 00043."
      - "Run the 'trace every outbound network call' prompt in
         audit/prompts/prompt-pack.md for an exhaustive, adversarial check."
    status: verified
    caveat: >
      This claim is scoped to MEETING CONTENT specifically — not to every outbound
      network call an operator chooses to configure. Calnode also talks to other
      third parties for separate, expected, operator/user-initiated integrations
      that carry no meeting content:
        - Calendar sync: Google Calendar, Microsoft Graph/Teams, CalDAV providers
          (iCloud, Fastmail, Nextcloud, etc.) — internal/gcal, internal/calendar.
        - Meeting links: Zoom (per-host OAuth) — meeting metadata only (topic,
          time); Zoom's own infrastructure handles Zoom-call audio, outside
          Calnode's process entirely.
        - Payments: Stripe, for paid bookings.
        - Optional analytics: GA4/GTM, native and consent-gated (see
          cookie-consent-gated-analytics below) — off by default, and even when on,
          carries no meeting content.
      LiveKit (built-in video) is the one integration where "leaves your
      infrastructure" depends entirely on an operator choice made at setup, not a
      Calnode default: if you point it at a self-hosted LiveKit server, live
      meeting audio/video never leaves infrastructure you control. If you point it
      at LiveKit Cloud instead, live meeting media transits LiveKit Cloud's
      infrastructure for the duration of the call — a third party beyond Deepgram/
      your BYO-LLM, and beyond what this claim's headline sentence alone would
      suggest. This is exactly analogous to choosing a self-hosted vs. managed
      database: Calnode's code path is identical either way, but the trust boundary
      is drawn by your own infrastructure choice, not by the code.
      A skeptical reader should verify this list is exhaustive themselves — that's
      exactly what the adversarial prompt above is for.

  - id: admin-frontend-google-fonts
    claim: >
      The admin SvelteKit app (frontend/src/app.html) unconditionally loads a font
      stylesheet from fonts.googleapis.com/fonts.gstatic.com on every /admin/ page
      load, with no operator opt-out. This carries only staff browser metadata
      (IP/User-Agent) — no application, booking, or meeting-content data — and is
      confined to the authenticated admin UI: neither the public booking templates
      (book.html/manage.html) nor the embed widget (embed.js) reference it.
    verify:
      - "grep -n 'fonts.googleapis\\|fonts.gstatic' frontend/src/app.html"
      - "grep -rn 'fonts.googleapis\\|fonts.gstatic' internal/handler/templates/
         internal/handler/embed.js — expect no matches, confirming it's admin-only."
    status: verified
    caveat: >
      This was undocumented until a Layer 2 audit pass flagged it — recorded here
      not because it's a security issue (it isn't: no app data reaches Google, and
      it's staff-only, not visitor-facing) but because an exhaustive egress claim
      should list every third-party call, however low-severity. A privacy-strict or
      air-gapped self-hoster who wants zero third-party calls even from the admin UI
      would need to vendor these fonts locally — not currently offered as a
      built-in toggle.

  - id: envelope-encryption-at-rest
    claim: >
      Secrets at rest (OAuth refresh tokens, API credentials) use envelope
      encryption — a per-secret data-encryption key wrapped by a root key-encryption
      key — not flat single-key AES-GCM.
    verify:
      - "internal/keyvault/keyvault.go — the KEK/DEK implementation."
      - "internal/db/migrations/{sqlite,postgres}/00017_crypto_keystore.sql — the
         keystore schema. ⚠️ The migrations are one schema in two spellings, one
         directory per engine, and every path in this file names both."
      - "CALNODE_ENCRYPTION_KEY / CALNODE_RECOVERY_SECRET env vars — rotation and
         escrow support."
    status: verified
    caveat: null

  - id: recording-consent-aware
    claim: >
      Built-in video recording is consent-aware: every participant gets a notice
      (audio announcement + on-screen prompt) and a Continue/Leave choice when a
      meeting is being recorded, and each decision is logged.
    verify:
      - "internal/db/migrations/{sqlite,postgres}/00044_meeting_consents.sql — the
         consent audit log."
      - "assets/livekit-room.js — the notice + Continue/Leave UI, triggered on the
         recording metadata flag."
    status: verified
    caveat: >
      This is a notice-and-choice model (the industry-standard Zoom/Teams/Meet
      pattern), not an affirmative all-party consent GATE — recording is not
      blocked from starting, and a participant who continues without explicitly
      clicking Accept is not prevented from being recorded (they can only Leave).
      This is a deliberate design choice, not an oversight; a stricter gate model
      was considered and deferred pending real customer demand.

  - id: cookie-consent-gated-analytics
    claim: >
      Native analytics (GA4/GTM) on the public booking pages is consent-gated:
      nothing loads, and no `_ga*` cookies are set, until the visitor explicitly
      accepts a cookie banner. Declining clears any analytics cookies already set.
    verify:
      - "internal/handler/templates/_shared.html — the trackingHead/consentBanner
         partials shared by book.html and manage.html."
      - "Load a booking page with GA4/GTM configured in an incognito window: the
         banner shows, and DevTools → Application → Cookies shows no _ga* cookie
         until you click Accept."
    status: verified
    caveat: >
      This claim covers the NATIVE GA4/GTM integration only. The separate
      operator-controlled 'Head HTML' code-injection field (Settings → Tracking) is
      intentionally NOT gated — it's arbitrary trusted code the operator pastes in
      themselves, equivalent to editing the template directly, and gating it isn't
      meaningful. The embed widget (embed.js) has neither native tracking nor a
      banner by design — it runs inside a customer's own website, which owns its
      own analytics and consent.

  - id: llm-no-raw-calendar-data
    claim: >
      The optional BYO-LLM layer (conversational booking, notetaker summaries) never
      sees raw calendar data or does time math itself — it only sees pre-computed
      availability/constraints and returns natural-language decisions that the
      deterministic backend executes.
    verify:
      - "internal/db/migrations/{sqlite,postgres}/00034_llm_settings.sql and
         00035_llm_instructions.sql —
         the BYO-LLM config (operator-supplied endpoint + key)."
      - "internal/handler/booking_assistant.go — the tool-loop drives
         computeSlots/createBookingForSlug (the same deterministic cores the REST
         API and MCP tools use); the LLM never queries the calendar directly."
    status: verified
    caveat: null

  - id: small-enough-to-audit
    claim: >
      The entire backend is small enough to fit in a single LLM context
      window, which is the whole premise of this audit kit — a cal.com-scale
      codebase can't do this.
    verify:
      - "Non-test Go source: ~37,300 lines / ~1.4MB across 146 files (find . -name
         '*.go' -not -name '*_test.go' -not -path './frontend/*' | xargs wc -l).
         Measured at last_verified_commit; it was ~24,000 lines across ~105 files
         before PostgreSQL support and MULTI_TENANT, so re-run the command rather
         than trusting this line."
      - "Full repository (backend + SvelteKit admin frontend + tests): ~4.9MB
         tracked (git ls-files -z | xargs -0 du -cb)."
    status: verified
    caveat: >
      The frontend admin app (SvelteKit) and its ~219 npm packages are NOT included
      in the 'fits in one context' claim — that's specifically about the Go backend,
      which is the security-relevant surface (auth, data, integrations). The
      lean-dependency-tree claim below is scoped the same way.

  - id: lean-dependency-tree
    claim: >
      The Go backend has a lean dependency tree — 11 direct and 22 indirect Go
      modules, 33 in total, not the sprawling transitive tree typical of larger
      frameworks.
    verify:
      - "Read go.mod: two require blocks, 11 entries and 22 `// indirect` entries.
         That is the number this claim states, and it is the one that is
         reproducible."
      - "syft dir:. --exclude './frontend/**' --exclude './.git/**' -o table | grep
         golang | wc -l"
      - "⚠️ `go list -m all | wc -l` returns considerably more (111 at
         last_verified_commit) because it includes every dependency's own TEST
         dependencies, which are not compiled into the binary. Both numbers are
         real; they answer different questions."
    status: verified
    caveat: >
      This claim is scoped to the Go backend. The SvelteKit admin frontend pulls in
      ~219 npm packages via its build tooling (Vite, Tailwind, Vitest, etc.) — normal
      for any modern frontend, but not itself a 'lean' differentiator, and not
      blended into this claim's number.

  - id: clean-security-scan
    claim: >
      As of the date/commit above, Calnode's Go backend has zero known
      vulnerabilities in its dependencies (govulncheck), zero unresolved SAST
      findings (gosec/semgrep — every finding is either fixed or documented inline
      as a verified false positive), and zero secrets in its full git history
      (gitleaks).
    verify:
      - "See AUDIT.md's scanner command block — run it yourself and compare."
      - "gosec findings that remain are all annotated inline with `#nosec` +
         reasoning at the exact line — see commit c4c067c, which triaged and
         annotated all findings after gosec turned out not to be wired into CI
         (a real gap: 44 findings had accumulated with zero annotations before
         that commit — see its message for the full triage)."
    status: verified
    caveat: >
      A clean scan today is not a permanent guarantee — dependencies gain new CVEs
      over time, and new code can introduce new unannotated findings. All three
      deterministic scanners this claim depends on (govulncheck, gosec, gitleaks)
      are now wired into CI (.github/workflows/audit.yml) as of commit c4c067c —
      previously only govulncheck and gitleaks were, which is exactly how the 44
      unannotated gosec findings above went unnoticed. semgrep is not yet a CI gate
      (still a manual step in AUDIT.md's scanner block).

  - id: fixed-roles-admin-full-access
    claim: >
      Calnode uses a fixed three-role model (owner/admin/member) with no
      configurable permission matrix. An admin or owner has full workspace access
      across every surface — REST, MCP, and the notetaker endpoints — including
      bookings, notes, and transcripts they don't personally host. This is applied
      consistently across surfaces, not a per-endpoint inconsistency.
    verify:
      - "internal/handler/mcp_oauth.go's mcpCallerScope — fullAccess = c.IsAdmin,
         which bypasses every userHostsBooking check for MCP tools."
      - "internal/handler/notetaker_http.go's GetBookingNotes/
         RegenerateBookingNotes/GetBookingTranscript — gated by requireAdmin only,
         the same full-access model as MCP's fullAccess, not a narrower host-scoped
         check."
      - "grep -rn 'requireAdmin' internal/handler — every admin-only handler grants
         workspace-wide access; there is no per-resource permission matrix to
         misconfigure or drift out of sync."
    status: verified
    caveat: >
      Recorded here because a prior Layer 2 audit pass flagged REST's admin-only
      gate on notetaker endpoints as a "cross-host leak" relative to MCP's access
      control — it isn't; both apply the identical fixed-roles model. Configurable/
      fine-grained RBAC (e.g. "admin can manage settings but not read other hosts'
      meeting content") is a deliberate scope decision, not a gap in the current
      model — see the project's architecture notes. If your threat model requires
      restricting admins from other hosts' booking content, that needs new code
      (a permission matrix), not a fix to an existing bug.

  - id: rate-limit-keys-on-tcp-source-address
    claim: >
      Per-IP rate limiting (internal/server/middleware.go's RateLimit) keys on the
      TCP-level remote address of the connection, and never on a client-supplied
      X-Forwarded-For unless the peer that sent it is inside an operator-configured
      TRUSTED_PROXY_CIDRS range — so a client cannot spoof headers to evade or split
      its rate-limit bucket. Single-value vendor headers (X-Real-IP,
      CF-Connecting-IP, True-Client-IP) are never read, from any peer.
    verify:
      - "internal/server/middleware.go's remoteIP — net.SplitHostPort(r.RemoteAddr)
         via peerIP, unless TrustClientIP has resolved a client IP into the request
         context, which it only does for a peer matching a trusted CIDR."
      - "internal/server/middleware.go's resolveClientIP — returns the peer outright
         for an untrusted peer, before any header is read."
      - "internal/server/ratelimit_test.go's TestRemoteIP_* — assert X-Forwarded-For
         and X-Real-IP are ignored even when RemoteAddr is loopback."
      - "internal/server/trustedproxy_test.go — asserts an untrusted peer's spoofed
         headers are ignored, that the X-Forwarded-For walk goes right-to-left past
         trusted hops (never the client-seeded leftmost entry), that a malformed
         header falls back to the peer, and that a vendor header is ignored even from
         a TRUSTED peer."
    status: verified
    caveat: >
      Recorded here because a prior Layer 2 audit pass flagged this as trusting
      spoofable proxy headers — it doesn't; the flagged behavior traced back to a
      stale doc comment describing the opposite of what the code does (fixed
      alongside this entry). TRUSTED_PROXY_CIDRS is empty by default, so an
      unconfigured instance behaves exactly as this claim originally described.
      Anything an operator does list can name any client IP it likes — that is what
      trusting a proxy means — so the list must hold only networks they control.
      Correct behavior otherwise requires the deployment's reverse proxy to connect
      to Calnode directly (or over a trusted private network) — see the deployment
      docs for reverse-proxy requirements (forward the original Host header, connect
      over a trusted path, strip client-supplied proxy headers at the edge).

  - id: caldav-connect-self-service-no-admin-gate
    claim: >
      POST /v1/calendar/caldav/connect (internal/handler/calendar.go's ConnectCalDAV)
      requires only RequireAuth, not requireAdmin — any team member can connect their
      own CalDAV account, matching the self-service pattern of Google/Microsoft
      calendar connect and Zoom connect (every one of which is also RequireAuth-only,
      never admin-gated). This is a deliberate product decision, not an oversight.
    verify:
      - "internal/server/server.go — compare the route registrations for
         POST /v1/calendar/caldav/connect, GET /v1/calendar/connect (Google), and
         GET /v1/zoom/connect: all three are h.RequireAuth(...) only, none is wrapped
         or inline-gated with requireAdmin."
      - "internal/handler/calendar.go's ConnectCalDAV body — no h.requireAdmin call;
         scopes the new connection to userFromContext(ctx).ID, i.e. the caller
         connects only their own account, never someone else's."
    status: verified
    caveat: >
      Recorded here because a Layer 2 audit pass flagged this as inconsistent with
      LLM/LiveKit settings requiring requireAdmin — that comparison doesn't hold:
      LLM/LiveKit settings are single, shared, workspace-wide configuration (hence
      admin-gated, same reasoning as every other *_settings.go handler), while
      calendar/meeting-tool connections are per-user personal integrations, uniformly
      self-service across all four providers. The one real asymmetry: CalDAV is the
      only one of the four where the server URL itself is user-supplied rather than a
      fixed OAuth vendor host, so a non-admin member can direct the server to probe an
      address on its network, bounded by the narrow metadata-only SSRF guard (see
      ResolveNotMetadata) and requiring the member to already hold a valid account on
      the instance. Explicitly decided (2026-07-02) to keep this self-service rather
      than add admin approval — the friction of gating a personal calendar connection
      behind admin sign-off was judged worse than the bounded, already-authenticated-
      user SSRF exposure it would close.
