name: 🐞 Bug report
description: Report a reproducible bug in District Scheduler (not a setup question or feature request).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start, please [search existing issues](https://github.com/distronode-corporation/district-scheduler/issues?q=is%3Aissue) —** it may already be reported or fixed.

        This tracker is for **reproducible bugs in District Scheduler**. For setup help, deployment questions, or "how do I…", please use [Discussions](https://github.com/distronode-corporation/district-scheduler/discussions) instead — those won't be actioned here.

        District Scheduler is a fork of [Calnode](https://github.com/Calnode/calnode) and most of the code is shared. If the bug is in upstream code rather than in this fork's changes, [reporting it upstream](https://github.com/Calnode/calnode/issues) gets every deployment the fix. Fork-only code (multi-tenant mode, the platform API, row-level security, the PostgreSQL image) belongs here.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: This is a reproducible bug in District Scheduler — not a configuration/setup question or a feature request.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What's the bug?
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps so a maintainer can reproduce it.
      placeholder: |
        1. Go to …
        2. Click …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: District Scheduler version / commit
      description: Shown at /version, or the commit you deployed.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which build?
      description: The two images are different products. The fork's is PostgreSQL-only and multi-tenant-capable; upstream's is the SQLite single-binary.
      options:
        - PostgreSQL image (ghcr.io/distronode-corporation/district-scheduler)
        - Upstream SQLite image (ghcr.io/calnode/calnode)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running District Scheduler?
      options:
        - Self-hosted — Docker
        - Self-hosted — binary
        - Railway / other PaaS
        - Not sure
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots, or anything else
      description: Optional, but it speeds up a fix.
