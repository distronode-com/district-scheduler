name: Audit

# Publishes the objective, third-party signals that back AUDIT.md/audit/claims.yaml
# (OpenSSF Scorecard + SBOM), and re-runs the deterministic half of claims.yaml as a
# CI gate so a claim silently going false (a second server-database driver, a tenant
# table without row-level security, a real vulnerability, a leaked secret) fails the
# build instead of quietly rotting.
# This is separate from ci.yml (build/test) — audit signal, not correctness.
on:
  push:
    branches: [main, district]
  # Fork divergence, deliberate: `district` is this fork's default branch, and the
  # scans below are worth running on a pull request too — Scorecard's SAST check
  # looks for a scanner running on PRs, and a vulnerability or leaked secret is
  # cheaper to catch before the merge than on the push after it.
  pull_request:
  schedule:
    - cron: '20 6 * * 1' # weekly, Monday — catches newly-disclosed CVEs even with no code changes
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: OpenSSF Scorecard
    # scorecard-action documents `pull_request` as experimental, and this job publishes results and needs id-token: write, neither of which means anything on a PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3 — floating v2 tag no longer resolves upstream; pinned to commit per Scorecard's own pinned-deps recommendation
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: results.sarif

  sbom:
    name: SBOM (syft)
    # An SBOM published per pull request is noise; the one that matters is the one for what is on the branch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: district-scheduler-sbom.cdx.json
          artifact-name: district-scheduler-sbom.cdx.json

  claims-guard:
    name: Deterministic claims guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks needs full history

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.32.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend (required by the Go embed, same as ci.yml)
        working-directory: frontend
        run: pnpm build

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # The two claim checks below assert THIS FORK's architecture, which is the
      # opposite of upstream's on both points: PostgreSQL is the one server database
      # (SQLite stays for the single-tenant build), and tenants share one database
      # isolated by row-level security. Upstream's greps ("no server-DB driver", "no
      # tenant column") would fail here by design, so they are replaced rather than
      # scoped off; a check that cannot fail on the repository it runs in guards
      # nothing. The vulnerability/secret scans underneath are useful everywhere.
      - name: PostgreSQL is the only server-database driver (postgres-image-and-mode claim)
        run: |
          if ! grep -q 'github.com/jackc/pgx/v5' go.mod; then
            echo "::error::go.mod no longer requires pgx; the PostgreSQL image claim in audit/claims.yaml is false"
            exit 1
          fi
          if grep -iE 'lib/pq|go-sql-driver/mysql|redis' go.mod; then
            echo "::error::go.mod pulled in a second server-database driver; re-check audit/claims.yaml"
            exit 1
          fi

      - name: Tenant isolation is row-level security, with its proofs present (row-level-security-tenant-isolation claim)
        run: |
          # RLS is enabled and FORCEd at boot by db.EnableRLS, deliberately not in a
          # migration (see internal/db/tenancy.go); the proof tests are what make the
          # claim falsifiable, so their presence is asserted here and they run in ci.yml.
          if ! grep -q 'FORCE ROW LEVEL SECURITY' internal/db/tenancy.go; then
            echo "::error::internal/db/tenancy.go no longer forces row-level security; the isolation claim in audit/claims.yaml is false"
            exit 1
          fi
          for f in internal/db/rls_proof_test.go internal/db/tenancy_test.go internal/server/tenancy_proof_test.go; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing; audit/claims.yaml names it as the proof of tenant isolation"
              exit 1
            fi
          done

      - name: govulncheck (clean-security-scan claim)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: gosec (clean-security-scan claim — AUDIT.md says every finding is annotated)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec ./...

      - name: gitleaks (clean-security-scan claim)
        # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
        # organization repositories, which this one is. The underlying CLI is
        # still free and open source (MIT), so install and run it directly, the
        # same way govulncheck/gosec above do, and the same invocation AUDIT.md
        # documents for a local run.
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks detect --source . --no-banner -v
