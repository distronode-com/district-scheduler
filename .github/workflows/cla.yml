# CLA Assistant — gates pull requests on a signed Contributor License Agreement.
#
# How it works: when someone opens a PR, the bot checks whether they've signed. If not, it
# comments asking them to sign by replying with the exact phrase below; their signature is
# recorded in signatures/version1/cla.json in this repo. Maintainers in `allowlist` are
# never asked.
#
# ── SETUP (two one-time steps) ─────────────────────────────────────────────────────────
# 1. Create a Personal Access Token (classic, `repo` scope — or a fine-grained token with
#    Contents + Pull requests write on this repo) and add it as a repo secret named
#    PERSONAL_ACCESS_TOKEN. It's needed so the bot can commit signatures + comment.
# 2. Edit `allowlist` below to your maintainers' GitHub usernames (so you don't have to sign
#    your own PRs).
# Until step 1 is done the workflow is inert (it just won't run successfully) — it does not
# block anything else.
name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    # This job runs on `pull_request_target` with write permissions, needs
    # secrets.PERSONAL_ACCESS_TOKEN, and stores signatures against the CLA document at
    # Calnode/calnode. On a fork none of that exists, so the job can only ever fail —
    # while still running a third-party action with write permissions on every PR
    # opened there. Restrict it to the repository the CLA actually belongs to.
    if: github.repository == 'Calnode/calnode'
    runs-on: ubuntu-latest
    # Scoped to this job rather than the whole workflow: these are the four scopes
    # contributor-assistant documents (it commits signatures, comments on the PR and
    # sets a status), kept unchanged, but no longer handed to anything added later.
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Calnode/calnode/blob/main/CLA.md'
          branch: 'main'
          custom-notsigned-prcomment: 'Thanks for your contribution! Before we can merge it, please read our [Contributor License Agreement](https://github.com/Calnode/calnode/blob/main/CLA.md) and sign it by posting the exact comment below in this PR.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
          # TODO: replace with your maintainers' GitHub usernames.
          allowlist: 'shockalotti,dependabot[bot]'
